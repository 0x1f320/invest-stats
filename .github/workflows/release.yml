name: Release

# dev publishes prereleases (1.2.0-dev.1), main publishes releases (1.2.0).
# semantic-release picks the version from the commits; see .releaserc.json.
on:
  push:
    branches: [dev, main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # tags and GitHub Releases
  pull-requests: write  # merging main back into dev

jobs:
  release:
    name: Release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Test
        run: scripts/test.sh

      - name: Import signing certificate and notary key
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT="$RUNNER_TEMP/cert.p12"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application identity in the certificate." >&2
            exit 1
          fi

          ASC_KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"

          {
            echo "TOSSBAR_SIGN_IDENTITY=$IDENTITY"
            echo "TOSSBAR_KEYCHAIN=$KEYCHAIN"
            echo "ASC_KEY_PATH=$ASC_KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: npx semantic-release

      # A release tag on main sits on a merge commit that dev does not contain, so
      # semantic-release on dev would not see it and would keep counting prereleases
      # of the old version. Merging main back into dev brings the tag into dev's history.
      - name: Merge main back into dev
        if: github.ref_name == 'main' && steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          TITLE="chore: merge v$VERSION back into dev"
          URL="$(gh pr create --base dev --head main --title "$TITLE" \
            --body "Brings the \`v$VERSION\` release tag into \`dev\`'s history so the next prerelease is computed from it. Opened and merged by the release workflow.")"
          gh pr merge "$URL" --merge --subject "$TITLE"

      - name: Remove signing keychain and notary key
        if: always()
        run: |
          if [[ -n "${TOSSBAR_KEYCHAIN:-}" ]]; then security delete-keychain "$TOSSBAR_KEYCHAIN" || true; fi
          rm -f "${ASC_KEY_PATH:-}"
